name: CI

on:
  push:
    branches: [main, stage, test]
  pull_request:
    branches: [main, stage, test]

jobs:
  validate:
    name: Validate (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [20.x]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check main process syntax
        run: node --check main.js

      - name: Check preload syntax
        run: node --check preload.js

      - name: Check src files syntax
        run: |
          find src -name "*.js" | while read f; do
            echo "Checking $f"
            node --check "$f"
          done
