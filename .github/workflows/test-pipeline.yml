name: Test Pipeline — CI + Promote to Stage

on:
  push:
    branches: [test]

jobs:
  # ─────────────────────────────────────────────
  # Job 1: Syntax & structure validation
  # ─────────────────────────────────────────────
  ci-validate:
    name: CI Validate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check main process syntax
        run: node --check main.js

      - name: Check preload syntax
        run: node --check preload.js

      - name: Check src JS files syntax
        run: |
          find src -name "*.js" | while read f; do
            echo "Checking $f"
            node --check "$f"
          done

      - name: Validate package.json required fields
        run: |
          node -e "
            const pkg = require('./package.json');
            const required = ['name','version','main','scripts','build'];
            const missing = required.filter(k => !pkg[k]);
            if (missing.length) { console.error('Missing fields:', missing); process.exit(1); }
            console.log('package.json OK — version', pkg.version);
          "

      - name: Check referenced asset files exist
        run: |
          node -e "
            const fs = require('fs');
            const files = [
              'main.js', 'preload.js',
              'assets/icon.icns', 'assets/icon.png', 'assets/trayTemplate.png',
              'src/dashboard/index.html', 'src/overlay/index.html'
            ];
            const missing = files.filter(f => !fs.existsSync(f));
            if (missing.length) { console.error('Missing files:', missing); process.exit(1); }
            console.log('All', files.length, 'required files present ✅');
          "

  # ─────────────────────────────────────────────
  # Job 2: Promote test → stage
  # Requires GH_PAT secret for downstream workflow trigger.
  # Falls back to GITHUB_TOKEN (promote succeeds, but stage
  # pipeline won't auto-trigger without PAT).
  # ─────────────────────────────────────────────
  promote-to-stage:
    name: Promote → Stage
    needs: ci-validate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout (full history)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GH_PAT || github.token }}

      - name: Configure Git bot identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Push test → stage
        run: git push origin HEAD:stage
